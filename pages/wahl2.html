<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Briefwahl beantragen</title>

<style>
* {
    box-sizing: border-box;
}

html {
    background: #f3f5f7;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2933;
    background: #f3f5f7;
}

body > main,
body > .container {
    width: min(100% - 24px, 680px);
    margin: 24px auto;
}

.container {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 20px;
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    line-height: 1.12;
}

.info {
    padding: 16px;
    margin-bottom: 22px;
    border-radius: 10px;
    background: #eef4ff;
    line-height: 1.55;
    overflow-wrap: anywhere;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: 700;
}

input {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #aeb7c2;
    border-radius: 7px;
    background: #fff;
    font-size: 16px;
}

input:focus {
    outline: 3px solid rgba(0,91,172,.18);
    border-color: #005bac;
}

.small {
    margin-top: 10px;
    font-size: .85rem;
    color: #5f6872;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 22px;
}

button {
    min-height: 46px;
    padding: 10px 14px;
    border: 0;
    border-radius: 8px;
    background: #005bac;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #004786;
}

.warning {
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #e5b700;
    border-radius: 10px;
    background: #fff7d6;
}

[hidden] {
    display: none !important;
}

@media (max-width: 520px) {
    body > main,
    body > .container {
        width: calc(100% - 20px);
        margin: 10px auto;
    }

    .container {
        padding: 18px;
        border-radius: 11px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    button {
        width: 100%;
    }
}
</style>
</head>
<body>
<style>
    .wahl2-card {
        max-width: 650px;
        margin: 0 auto;
    }

    .wahl-info {
        background: #eef3ff;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 20px;
        line-height: 1.55;
    }

    .wahl-warning {
        background: #fff3cd;
        border: 1px solid #ffe69c;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .wahl-field {
        margin-bottom: 14px;
    }

    .wahl-field label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .wahl-field input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px;
    }

    .wahl-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .wahl-actions button {
        padding: 10px 16px;
        cursor: pointer;
    }
</style>


<div class="wahl2-card">

    <h1 id="page-title">Briefwahl beantragen</h1>

    <div id="wahl-info" class="wahl-info">
        Daten werden geladen …
    </div>

    <div id="ar-warning" class="wahl-warning" hidden>
        <strong>Aufsichtsratswahl:</strong><br>
        Die Briefwahlanforderung für die Aufsichtsratswahl
        ist derzeit noch nicht eingerichtet.
        Der endgültige Text und die Rechtsgrundlage werden
        später ergänzt.
    </div>


    <div id="request-form">

        <div class="wahl-field">
            <label for="vorname">Vorname *</label>
            <input id="vorname" autocomplete="given-name">
        </div>

        <div class="wahl-field">
            <label for="nachname">Nachname *</label>
            <input id="nachname" autocomplete="family-name">
        </div>

        <div class="wahl-field">
            <label for="pnr">Personalnummer *</label>
            <input id="pnr">
        </div>

        <div class="wahl-field">
            <label for="grund">Grund der Abwesenheit</label>
            <input
                id="grund"
                placeholder="optional, z. B. Urlaub / Krankheit / Dienstreise"
            >
        </div>

        <small>* Pflichtfelder</small>

        <div class="wahl-actions">
            <button type="button" onclick="sendMail()">
                Antrag per Mail senden
            </button>

            <button type="button" onclick="downloadPDF()">
                PDF herunterladen
            </button>
        </div>

    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

<script>

let wahlart = "BR";
let bkz = "";
let betrieb = "";
let vorsitz = "";
let anschrift = "";
let email = "";


const WAHLEN = {

    BR: {
        name: "Betriebsratswahl",
        subject: "Briefwahlanforderung zur BR-Wahl",
        legal:
            "gemäß § 24 Abs. 1 Wahlordnung zum Betriebsverfassungsgesetz"
    },

    JAV: {
        name: "JAV-Wahl",
        subject: "Briefwahlanforderung zur JAV-Wahl",
        legal:
            "gemäß § 39 Abs. 4 in Verbindung mit § 24 Abs. 1 Wahlordnung zum Betriebsverfassungsgesetz"
    },

    SBV: {
        name: "SBV-Wahl",
        subject: "Briefwahlanforderung zur SBV-Wahl",
        legal:
            "gemäß § 11 Abs. 1 SchwbVWO"
    },

    AR: {
        name: "Aufsichtsratswahl",
        subject: "Briefwahlanforderung zur AR-Wahl",
        placeholder: true
    }

};


function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value || "";

    return div.innerHTML;
}


document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);


    // Alte direkte Parameter bleiben zunächst kompatibel.
    wahlart = (params.get("wahlart") || wahlart).toUpperCase();

    betrieb = params.get("betrieb") || betrieb;
    vorsitz = params.get("vorsitz") || vorsitz;
    anschrift = params.get("anschrift") || anschrift;
    email = params.get("email") || email;


    // Neues komprimiertes QR-Format.
    const packed = params.get("p");

    if (packed) {

        try {

            const json =
                LZString.decompressFromEncodedURIComponent(packed);

            const data = JSON.parse(json || "{}");

            wahlart = (data.w || wahlart).toUpperCase();
            bkz = data.b || bkz;
            betrieb = data.n || betrieb;
            vorsitz = data.v || vorsitz;
            anschrift = data.a || anschrift;
            email = data.e || email;

        }
        catch (error) {

            console.warn(
                "QR-Daten konnten nicht gelesen werden",
                error
            );
        }
    }


    if (!WAHLEN[wahlart]) {
        wahlart = "BR";
    }


    const config = WAHLEN[wahlart];

    document.getElementById("page-title").textContent =
        "Briefwahl beantragen – " + config.name;


    document.getElementById("wahl-info").innerHTML = `
        <strong>Wahlart:</strong>
        ${escapeHTML(config.name)}<br>

        <strong>Betrieb:</strong>
        ${escapeHTML(betrieb)}<br>

        <strong>Wahlvorstand:</strong>
        ${escapeHTML(vorsitz)}<br>

        <strong>Anschrift:</strong>
        ${escapeHTML(anschrift)}<br>

        <strong>E-Mail:</strong>
        ${escapeHTML(email)}
    `;


    if (config.placeholder) {

        document.getElementById("ar-warning").hidden = false;
        document.getElementById("request-form").hidden = true;
    }

});


function getPersonData() {

    return {
        vorname:
            document.getElementById("vorname").value.trim(),

        nachname:
            document.getElementById("nachname").value.trim(),

        pnr:
            document.getElementById("pnr").value.trim(),

        grund:
            document.getElementById("grund").value.trim()
    };
}


function validatePerson(data) {

    if (!data.vorname || !data.nachname || !data.pnr) {

        alert("Bitte alle Pflichtfelder ausfüllen.");

        return false;
    }

    return true;
}


function buildMailText(data) {

    const config = WAHLEN[wahlart];

    if (!config || config.placeholder) {
        return "";
    }


    let verhinderung;

    if (data.grund) {

        verhinderung =
            `da ich zum Zeitpunkt der Wahl wegen ${data.grund} ` +
            `an der persönlichen Stimmabgabe verhindert bin`;

    }
    else {

        verhinderung =
            "da ich zum Zeitpunkt der Wahl an der persönlichen " +
            "Stimmabgabe verhindert bin";
    }


    return `Sehr geehrte Damen und Herren,

hiermit beantrage ich ${data.vorname} ${data.nachname} ${config.legal}
die schriftliche Stimmabgabe, ${verhinderung}.

Mit freundlichen Grüßen

${data.vorname} ${data.nachname}
Personalnummer: ${data.pnr}`;
}


function sendMail() {

    const data = getPersonData();

    if (!validatePerson(data)) {
        return;
    }


    const config = WAHLEN[wahlart];

    if (!config || config.placeholder) {
        return;
    }


    const subject =
        `${config.subject} - ${betrieb}`;

    const text =
        buildMailText(data);


    window.location.href =
        `mailto:${email}` +
        `?subject=${encodeURIComponent(subject)}` +
        `&body=${encodeURIComponent(text)}`;
}


function downloadPDF() {

    const data = getPersonData();

    if (!validatePerson(data)) {
        return;
    }


    const config = WAHLEN[wahlart];

    if (!config || config.placeholder) {
        return;
    }


    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const text = buildMailText(data);

    const lines =
        doc.splitTextToSize(text, 180);

    doc.text(lines, 15, 30);

    doc.save(
        `Briefwahl_${wahlart}_${data.nachname}.pdf`
    );
}

</script>
</body>
</html>
